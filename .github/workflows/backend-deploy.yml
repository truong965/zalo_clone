name: Backend Stack CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/zalo_backend/**'
      - 'backend/zalo_media_worker/**'
      - '.github/workflows/backend-deploy.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  DOCKERHUB_BACKEND_IMAGE: trungmai965/zalo_backend
  DOCKERHUB_MEDIA_WORKER_IMAGE: trungmai965/zalo_media_worker
  EC2_STACK_DIR: ~/zalo_stack
  AWS_REGION: ap-southeast-1

jobs:
  build-and-push:
    name: Build & Push Backend Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/zalo_backend
          file: ./backend/zalo_backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKERHUB_BACKEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_BACKEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=zalo-backend-api
          cache-to: type=gha,mode=max,scope=zalo-backend-api

      - name: Build and push media worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/zalo_media_worker/Dockerfile.worker
          push: true
          tags: |
            ${{ env.DOCKERHUB_MEDIA_WORKER_IMAGE }}:latest
            ${{ env.DOCKERHUB_MEDIA_WORKER_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=zalo-media-worker
          cache-to: type=gha,mode=max,scope=zalo-media-worker

  deploy:
    name: Deploy Backend Stack via AWS SSM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare deploy script
        shell: bash
        run: |
          set -e
          mkdir -p .deploy
          cat > .deploy/deploy-backend.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          ARTIFACT_URI="$1"
          STACK_DIR="$HOME/zalo_stack"

          mkdir -p "$STACK_DIR"
          cd "$STACK_DIR"

          echo ">>> Downloading compose and nginx config from S3..."
          aws s3 cp "$ARTIFACT_URI/docker-compose.prod.yml" docker-compose.prod.yml
          aws s3 cp "$ARTIFACT_URI/nginx.conf" nginx.conf

          echo ">>> Checking required production files..."
          test -f .env
          test -f docker-compose.prod.yml
          test -f nginx.conf

          echo ">>> Ensuring required infrastructure containers are running..."
          docker compose -f docker-compose.prod.yml --env-file .env up -d postgres redis ai_redis

          echo ">>> Pulling latest backend images..."
          docker compose -f docker-compose.prod.yml --env-file .env pull api media_worker nginx

          echo ">>> Running database migrations..."
          docker compose -f docker-compose.prod.yml --env-file .env run --rm api npx prisma migrate deploy

          echo ">>> Restarting API, media worker, and nginx..."
          docker compose -f docker-compose.prod.yml --env-file .env up -d --force-recreate api media_worker nginx

          echo ">>> Waiting for API healthcheck..."
          for i in $(seq 1 18); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' zalo_api_prod 2>/dev/null || echo "not_found")
            echo "  [$i/18] api health status: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              break
            fi
            if [ "$i" = "18" ]; then
              echo "API healthcheck timed out."
              docker compose -f docker-compose.prod.yml --env-file .env logs --tail=80 api
              exit 1
            fi
            sleep 10
          done

          echo ">>> Checking nginx health endpoint..."
          docker compose -f docker-compose.prod.yml --env-file .env exec -T nginx wget -qO- http://localhost/health

          echo ">>> Pruning dangling images..."
          docker image prune -f

          echo "Backend stack deploy completed."
          SCRIPT
          chmod +x .deploy/deploy-backend.sh

      - name: Upload deploy artifacts to S3
        shell: bash
        env:
          DEPLOY_ARTIFACT_BUCKET: ${{ secrets.DEPLOY_ARTIFACT_BUCKET }}
        run: |
          set -e
          ARTIFACT_URI="s3://${DEPLOY_ARTIFACT_BUCKET}/zalo-deploy/${GITHUB_SHA}"
          aws s3 cp backend/zalo_backend/docker-compose.prod.yml "${ARTIFACT_URI}/docker-compose.prod.yml"
          aws s3 cp backend/zalo_backend/nginx.conf "${ARTIFACT_URI}/nginx.conf"
          aws s3 cp .deploy/deploy-backend.sh "${ARTIFACT_URI}/deploy-backend.sh"

      - name: Run deploy command on EC2 via SSM
        shell: bash
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DEPLOY_ARTIFACT_BUCKET: ${{ secrets.DEPLOY_ARTIFACT_BUCKET }}
        run: |
          set -e
          ARTIFACT_URI="s3://${DEPLOY_ARTIFACT_BUCKET}/zalo-deploy/${GITHUB_SHA}"

          cat > ssm-params.json <<JSON
          {
            "commands": [
              "aws s3 cp ${ARTIFACT_URI}/deploy-backend.sh /tmp/deploy-backend.sh",
              "chmod +x /tmp/deploy-backend.sh",
              "/tmp/deploy-backend.sh ${ARTIFACT_URI}"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy zalo backend stack ${GITHUB_SHA}" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command id: $COMMAND_ID"

          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "[$i/90] SSM status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "SSM deploy failed."
                echo "----- STDOUT -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text || true
                echo "----- STDERR -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text || true
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "SSM deploy timed out while waiting for command result."
          exit 1
