services:
  api:
    image: trungmai965/zalo_backend:latest
    container_name: zalo_api_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${BACKEND_REDIS_PASSWORD}
      REDIS_DB: 0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
      QUEUE_PROVIDER: ${QUEUE_PROVIDER}
      SQS_IMAGE_QUEUE_URL: ${SQS_IMAGE_QUEUE_URL}
      SQS_IMAGE_DLQ_URL: ${SQS_IMAGE_DLQ_URL}
      SQS_VIDEO_QUEUE_URL: ${SQS_VIDEO_QUEUE_URL}
      SQS_VIDEO_DLQ_URL: ${SQS_VIDEO_DLQ_URL}
      SQS_VISIBILITY_TIMEOUT_IMAGE: ${SQS_VISIBILITY_TIMEOUT_IMAGE}
      SQS_VISIBILITY_TIMEOUT_VIDEO: ${SQS_VISIBILITY_TIMEOUT_VIDEO}
      SQS_WAIT_TIME: ${SQS_WAIT_TIME}
      STUN_SERVER_URL: ${STUN_SERVER_URL}
      TURN_SERVER_URL: ${TURN_SERVER_URL}
      TURN_SECRET: ${TURN_SECRET}
      TURN_CREDENTIAL_TTL: ${TURN_CREDENTIAL_TTL}
      DEFAULT_ICE_TRANSPORT_POLICY: ${DEFAULT_ICE_TRANSPORT_POLICY}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      DAILY_API_KEY: ${DAILY_API_KEY}
      DAILY_DOMAIN: ${DAILY_DOMAIN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
      LOG_LEVEL: ${LOG_LEVEL}
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED}
      AI_ZALO_URL: ${AI_ZALO_URL}
      AI_UNIFIED_STREAM_ENABLED: ${AI_UNIFIED_STREAM_ENABLED}
      AI_REDIS_HOST: ai_redis
      AI_REDIS_PORT: 6379
      AI_REDIS_PASSWORD: ${AI_REDIS_PASSWORD}
      AI_REDIS_DB: ${AI_REDIS_DB}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SMS_PROVIDER_TYPE: ${SMS_PROVIDER_TYPE}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_OTP_CHAT_ID: ${TELEGRAM_OTP_CHAT_ID}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
      EMAIL_HOST: ${EMAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      EMAIL_AUTH_USER: ${EMAIL_AUTH_USER}
      EMAIL_AUTH_PASSWORD: ${EMAIL_AUTH_PASSWORD}
      EMAIL_PREVIEW: ${EMAIL_PREVIEW}
      TOTP_ISSUER: ${TOTP_ISSUER}
      TOTP_WINDOW: ${TOTP_WINDOW}
      MAX_PAYLOAD_SIZE: ${MAX_PAYLOAD_SIZE}
      MAX_SOCKET_CONNECTIONS: ${MAX_SOCKET_CONNECTIONS}
      PING_INTERVAL: ${PING_INTERVAL}
      PING_TIMEOUT: ${PING_TIMEOUT}
      UPGRADE_TIMEOUT: ${UPGRADE_TIMEOUT}
      PRESIGNED_URL_EXPIRY: ${PRESIGNED_URL_EXPIRY}
      RETRY_DB_MAX_ATTEMPTS: ${RETRY_DB_MAX_ATTEMPTS}
      RETRY_DB_BASE_DELAY_MS: ${RETRY_DB_BASE_DELAY_MS}
      RETRY_S3_MAX_ATTEMPTS: ${RETRY_S3_MAX_ATTEMPTS}
      RETRY_S3_RETRY_DELAY_MS: ${RETRY_S3_RETRY_DELAY_MS}
      CLEANUP_TEMP_MAX_AGE_HOURS: ${CLEANUP_TEMP_MAX_AGE_HOURS}
      CLEANUP_FAILED_MAX_AGE_DAYS: ${CLEANUP_FAILED_MAX_AGE_DAYS}
      CLEANUP_SOFT_DELETE_MAX_AGE_DAYS: ${CLEANUP_SOFT_DELETE_MAX_AGE_DAYS}
      CLEANUP_BATCH_SIZE: ${CLEANUP_BATCH_SIZE}
      SERVER_INSTANCE: ${SERVER_INSTANCE}
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:18.1-alpine
    container_name: zalo_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4-alpine
    container_name: zalo_redis_prod
    restart: always
    command: redis-server --requirepass ${BACKEND_REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${BACKEND_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  media_worker:
    image: trungmai965/zalo_media_worker:latest
    container_name: zalo_media_worker_prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      QUEUE_PROVIDER: ${QUEUE_PROVIDER}
      API_INTERNAL_URL: http://api:3000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
      SQS_IMAGE_QUEUE_URL: ${SQS_IMAGE_QUEUE_URL}
      SQS_IMAGE_DLQ_URL: ${SQS_IMAGE_DLQ_URL}
      SQS_VIDEO_QUEUE_URL: ${SQS_VIDEO_QUEUE_URL}
      SQS_VIDEO_DLQ_URL: ${SQS_VIDEO_DLQ_URL}
      SQS_VISIBILITY_TIMEOUT_IMAGE: ${SQS_VISIBILITY_TIMEOUT_IMAGE}
      SQS_VISIBILITY_TIMEOUT_VIDEO: ${SQS_VISIBILITY_TIMEOUT_VIDEO}
      SQS_WAIT_TIME: ${SQS_WAIT_TIME}
      IMAGE_WORKER_CONCURRENCY: ${IMAGE_WORKER_CONCURRENCY}
      VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB}
      MAX_VIDEO_SIZE_MB: ${MAX_VIDEO_SIZE_MB}
      MAX_AUDIO_SIZE_MB: ${MAX_AUDIO_SIZE_MB}
      MAX_DOCUMENT_SIZE_MB: ${MAX_DOCUMENT_SIZE_MB}
      MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS}
      MAX_AUDIO_DURATION_SECONDS: ${MAX_AUDIO_DURATION_SECONDS}
      MAX_IMAGE_DIMENSION: ${MAX_IMAGE_DIMENSION}
      MAX_VIDEO_DIMENSION: ${MAX_VIDEO_DIMENSION}
      STREAM_THRESHOLD_MB: ${STREAM_THRESHOLD_MB}
      UPLOAD_RATE_LIMIT_PER_MINUTE: ${UPLOAD_RATE_LIMIT_PER_MINUTE}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy

  ai:
    image: trungmai965/ai_zalo:latest
    container_name: ai_zalo_app_prod
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: production
      MAIN_APP_INTERNAL_URL: ${MAIN_APP_INTERNAL_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AI_UNIFIED_STREAM_ENABLED: ${AI_UNIFIED_STREAM_ENABLED}
      REDIS_HOST: ai_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${AI_REDIS_PASSWORD}
      REDIS_DB: ${AI_REDIS_DB}
      AI_DATABASE_URL: ${AI_DATABASE_URL}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL}
      GEMINI_EMBED_OUTPUT_DIMENSION: ${GEMINI_EMBED_OUTPUT_DIMENSION}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_ROUTER_MODEL: ${OPENAI_ROUTER_MODEL}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
      COHERE_API_KEY: ${COHERE_API_KEY}
      COHERE_RERANK_MODEL: ${COHERE_RERANK_MODEL}
      RERANK_TOP_N: ${RERANK_TOP_N}
      CONTEXT_COMPRESSION_THRESHOLD: ${CONTEXT_COMPRESSION_THRESHOLD}
      HYBRID_SEARCH_DENSE_WEIGHT: ${HYBRID_SEARCH_DENSE_WEIGHT}
      HYBRID_SEARCH_SPARSE_WEIGHT: ${HYBRID_SEARCH_SPARSE_WEIGHT}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_LLM_MODEL: ${GROQ_LLM_MODEL}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER}
      FALLBACK_LLM_PROVIDER: ${FALLBACK_LLM_PROVIDER}
      CRITIC_GROUNDEDNESS_THRESHOLD: ${CRITIC_GROUNDEDNESS_THRESHOLD}
      CRITIC_HALLUCINATION_THRESHOLD: ${CRITIC_HALLUCINATION_THRESHOLD}
      CRAG_RELEVANCE_THRESHOLD: ${CRAG_RELEVANCE_THRESHOLD}
      CRAG_MAX_RETRIES: ${CRAG_MAX_RETRIES}
    depends_on:
      ai_postgres:
        condition: service_healthy
      ai_redis:
        condition: service_healthy

  ai_postgres:
    image: postgres:18.1-alpine
    container_name: ai_zalo_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${AI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AI_POSTGRES_DB}
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_POSTGRES_USER} -d ${AI_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai_redis:
    image: redis:8.4-alpine
    container_name: ai_zalo_redis_prod
    restart: always
    command: redis-server --requirepass ${AI_REDIS_PASSWORD} --appendonly yes
    volumes:
      - ai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AI_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: zalo_nginx_prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  ai_postgres_data:
  ai_redis_data:
  nginx_logs:
